services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: leaderboard
      POSTGRES_DB: leaderboard
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - synchronous_commit=on
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard -d leaderboard"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 3gb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    # SIGTERM triggers an AOF fsync; a SIGKILL after a short timeout would lose the AOF tail.
    stop_grace_period: 30s

  migrate:
    build: .
    command: ["node", "dist/cli/migrate.js"]
    environment:
      DATABASE_URL: postgres://leaderboard:leaderboard@postgres:5432/leaderboard
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    # Safety net for any process crash; PG/Redis outages are handled in-process.
    restart: unless-stopped
    command: ["node", "dist/api.js"]
    environment:
      DATABASE_URL: postgres://leaderboard:leaderboard@postgres:5432/leaderboard
      REDIS_URL: redis://redis:6379/0
      PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    # Safety net for any process crash; PG/Redis outages are handled in-process.
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://leaderboard:leaderboard@postgres:5432/leaderboard
      REDIS_URL: redis://redis:6379/0
      WORKER_METRICS_PORT: "9100"
    ports:
      - "${METRICS_PORT:-9100}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
